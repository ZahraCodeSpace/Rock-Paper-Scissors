<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissors</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* حل مشکل ریسپانسیو */
    @media (max-width: 639px) {
        main > div { flex-direction: column; gap: 1rem !important; }
        #result { order: -1; margin-bottom: 0.5rem; }
    }
    /* افکت هاور برای دکمه‌ها */
    .choice:hover { transform: translateY(-5px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
  </style>
</head>

<body class="min-h-screen bg-[#fefcf8] flex flex-col font-sans">

  <!-- Header -->
  <header class="w-full pt-8 pb-4">
    <h1 class="text-center text-4xl md:text-5xl font-extrabold text-[#475569]">
      Rock Paper Scissors
    </h1>
    <p class="mt-3 text-center text-lg font-medium text-[#94a3b8]">
      First to 5 Points Wins
    </p>

    <div class="mt-8 w-full max-w-lg mx-auto flex justify-between px-10">
      <div class="flex flex-col items-center bg-white px-6 py-2 rounded-2xl shadow-sm border border-slate-100">
        <h2 class="text-sm font-bold text-red-400 uppercase tracking-widest">Player</h2>
        <span id="playerScore" class="text-4xl font-black text-slate-700">0</span>
      </div>
      <div class="flex flex-col items-center bg-white px-6 py-2 rounded-2xl shadow-sm border border-slate-100">
        <h2 class="text-sm font-bold text-blue-400 uppercase tracking-widest">Computer</h2>
        <span id="computerScore" class="text-4xl font-black text-slate-700">0</span>
      </div>
    </div>
  </header>

  <!-- Main -->
  <main class="flex-1 flex flex-col items-center justify-center px-4 py-7">

  <div class="flex flex-col sm:flex-row items-center justify-center gap-6 sm:gap-10 w-full max-w-4xl mx-auto">

    <!-- Player Box -->
    <div class="relative w-36 h-36 sm:w-44 sm:h-44 md:w-52 md:h-52 lg:w-56 lg:h-56 rounded-[2rem] bg-white border border-slate-200 shadow-xl flex items-center justify-center overflow-hidden">
      <span id="playerQuestion" class="text-5xl sm:text-6xl md:text-7xl text-slate-200 font-bold">?</span>
      <img id="playerImage" class="absolute w-full h-full object-cover hidden" alt="Player Choice">
    </div>

    <!-- VS -->
    <p id="result" class="text-lg sm:text-xl md:text-2xl font-black text-slate-500 uppercase tracking-tighter">
      vs
    </p>

    <!-- Computer Box -->
    <div class="relative w-36 h-36 sm:w-44 sm:h-44 md:w-52 md:h-52 lg:w-56 lg:h-56 rounded-[2rem] bg-white border border-slate-200 shadow-xl flex items-center justify-center overflow-hidden">
      <span id="computerQuestion" class="text-5xl sm:text-6xl md:text-7xl text-slate-200 font-bold">?</span>
      <img id="computerImage" class="absolute w-full h-full object-cover hidden" alt="Computer Choice">
    </div>

  </div>

</main>
  <!-- Footer -->
  <footer class="w-full  px-4 flex justify-center ">
    <div class="bg-white rounded-3xl shadow-2xl border border-slate-100 p-4 flex items-center justify-center gap-4">
      
      <!-- Buttons: تصاویر حالا با object-cover کل باکس را پر می‌کنند -->
      <div class="choice w-24 h-24 md:w-32 md:h-32 rounded-2xl border border-slate-100 bg-white flex items-center justify-center cursor-pointer transition-all duration-300 overflow-hidden" data-choice="rock">
        <img src="src/img/Annotation 2026-07-03 091158.png" alt="Rock" class="w-full h-full object-cover pointer-events-none">
      </div>
      <div class="choice w-24 h-24 md:w-32 md:h-32 rounded-2xl border border-slate-100 bg-white flex items-center justify-center cursor-pointer transition-all duration-300 overflow-hidden" data-choice="paper">
        <img src="src/img/Annotation 2026-07-03 091043.png" alt="Paper" class="w-full h-full object-cover pointer-events-none">
      </div>
      <div class="  choice w-24 h-24 md:w-32 md:h-32 rounded-2xl border border-slate-100 bg-white flex items-center justify-center cursor-pointer transition-all duration-300 overflow-hidden" data-choice="scissors">
        <img src="src/img/Annotation 2026-07-03 091131.png" alt="Scissors" class="w-full h-full object-cover pointer-events-none ">
      </div>
    </div>
  </footer>
